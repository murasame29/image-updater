- registryURI: 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/apps/$1/$2/$3
  githubRepository: "https://github.com/example-org/example-manifests/services/$1/$2/$3/overlays/development"
  denyImageTag:
    - latest
    - main

- allowImageTag: regexp:^[0-9a-f]{7,40}$
  denyImageTag: [latest]
  registryURI: 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/apps/internal/tools/$1:$2.*
  githubRepository: "https://github.com/example-org/example-manifests/services/internal-tools/$2/$1/overlays/development"

- denyImageTag: [latest]
  registryURI: 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/apps/multi-tenant/tools/$1:$2.$3.*
  githubRepository: "https://github.com/example-org/example-manifests/services/internal-tools/$2/$1/$3/overlays/development"
