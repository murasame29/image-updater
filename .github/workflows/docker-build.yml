name: Container image

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'Dockerfile'
      - 'LICENSE'
      - 'NOTICE'
      - 'hack/check_licenses.sh'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [master]
    tags: ['v*.*.*']
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'Dockerfile'
      - 'LICENSE'
      - 'NOTICE'
      - 'hack/check_licenses.sh'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable application tag to recover (vX.Y.Z)
        required: true
        type: string
      expected_commit:
        description: Full commit SHA peeled from the annotated release tag
        required: true
        type: string
      expected_digest:
        description: Immutable sha256 digest of the existing exact image
        required: true
        type: string
      migrate_legacy_aliases:
        description: Permit migration of self-labeled legacy floating aliases
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: container-${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  recover-stable-release:
    if: github.event_name == 'workflow_dispatch'
    needs: license
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_DIGEST: ${{ inputs.expected_digest }}
      MIGRATE_LEGACY_ALIASES: ${{ inputs.migrate_legacy_aliases }}
    steps:
      - name: Checkout recovery workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact image and recover stable aliases
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != 'branch' || "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo 'release recovery must use the reviewed default-branch workflow' >&2
            exit 1
          fi

          stable_tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "${RELEASE_TAG}" =~ ${stable_tag_pattern} ]]; then
            echo "release_tag must be a stable SemVer tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          version="${RELEASE_TAG#v}"
          if [[ ! "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'expected_commit must be a full lowercase commit SHA' >&2
            exit 1
          fi
          if [[ ! "${EXPECTED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'expected_digest must be a lowercase sha256 digest' >&2
            exit 1
          fi

          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != 'tag' ]]; then
            echo "release tag must be annotated: ${RELEASE_TAG}" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "${tag_commit}" != "${EXPECTED_COMMIT}" ]]; then
            echo "release tag commit mismatch: ${tag_commit}" >&2
            exit 1
          fi

          marker="<!-- image-updater-release application commit=${EXPECTED_COMMIT} version=${version} -->"
          body="$(gh release view "${RELEASE_TAG}" --json body --jq .body)"
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          is_prerelease="$(gh release view "${RELEASE_TAG}" --json isPrerelease --jq .isPrerelease)"
          if [[ "${body}" != *"${marker}"* || "${is_prerelease}" != 'false' ]]; then
            echo 'GitHub Release does not match the requested stable release' >&2
            exit 1
          fi
          if [[ "${is_draft}" != 'true' && "${is_draft}" != 'false' ]]; then
            echo 'unable to determine GitHub Release state' >&2
            exit 1
          fi

          exact_image="${REGISTRY}/${IMAGE_NAME}:${version}"
          source_image="${REGISTRY}/${IMAGE_NAME}@${EXPECTED_DIGEST}"
          resolved_digest="$(docker buildx imagetools inspect \
            "${exact_image}" --format '{{.Manifest.Digest}}')"
          if [[ "${resolved_digest}" != "${EXPECTED_DIGEST}" ]]; then
            echo "exact image digest mismatch: ${resolved_digest}" >&2
            exit 1
          fi
          for platform in linux/amd64 linux/arm64; do
            docker pull --quiet --platform "${platform}" "${source_image}" >/dev/null
            identity="$(docker image inspect --platform "${platform}" "${source_image}" \
              --format '{{.Os}}|{{.Architecture}}|{{ index .Config.Labels "org.opencontainers.image.revision" }}|{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            IFS='|' read -r image_os image_arch revision image_version <<< "${identity}"
            if [[ "${image_os}/${image_arch}" != "${platform}" || \
              "${revision}" != "${EXPECTED_COMMIT}" || "${image_version}" != "${version}" ]]; then
              echo "exact image identity mismatch (${platform}): ${identity}" >&2
              exit 1
            fi
          done

          minor="${version%.*}"
          aliases=("${minor}" latest)
          if [[ "${major}" != '0' ]]; then
            aliases+=("${major}")
          fi
          stable_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          for alias in "${aliases[@]}"; do
            alias_image="${REGISTRY}/${IMAGE_NAME}:${alias}"
            set +e
            current_digest="$(docker buildx imagetools inspect \
              "${alias_image}" --format '{{.Manifest.Digest}}' 2>&1)"
            lookup_status=$?
            set -e
            if [[ ${lookup_status} -eq 0 ]]; then
              if [[ "${current_digest}" == "${EXPECTED_DIGEST}" ]]; then
                echo "alias already points to the exact image: ${alias_image}"
                continue
              fi

              docker pull --quiet --platform linux/amd64 "${alias_image}" >/dev/null
              current_version="$(docker image inspect "${alias_image}" \
                --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
              if [[ "${current_version}" =~ ${stable_pattern} ]]; then
                if [[ "${current_version}" == "${version}" ]]; then
                  echo "alias conflicts with the exact release: ${alias_image}" >&2
                  exit 1
                fi
                highest="$(printf '%s\n%s\n' "${current_version}" "${version}" \
                  | sort --version-sort | tail -n 1)"
                if [[ "${highest}" != "${version}" ]]; then
                  echo "not regressing ${alias_image} from ${current_version} to ${version}"
                  continue
                fi
              elif [[ "${MIGRATE_LEGACY_ALIASES}" == 'true' && "${current_version}" == "${alias}" ]]; then
                echo "migrating self-labeled legacy alias: ${alias_image}"
              else
                echo "existing alias has unrecognized version metadata: ${alias_image}" >&2
                exit 1
              fi
            elif ! grep --extended-regexp --ignore-case --quiet \
              'manifest unknown|no such manifest|not found' <<< "${current_digest}"; then
              echo "unable to resolve image alias: ${alias_image}" >&2
              echo "${current_digest}" >&2
              exit 1
            fi

            docker buildx imagetools create --tag "${alias_image}" "${source_image}"
            recovered_digest="$(docker buildx imagetools inspect \
              "${alias_image}" --format '{{.Manifest.Digest}}')"
            if [[ "${recovered_digest}" != "${EXPECTED_DIGEST}" ]]; then
              echo "recovered alias digest mismatch: ${alias_image}" >&2
              exit 1
            fi
          done

  finalize-recovered-release:
    if: github.event_name == 'workflow_dispatch'
    needs: recover-stable-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - name: Publish recovered GitHub Release
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          marker="<!-- image-updater-release application commit=${EXPECTED_COMMIT} version=${version} -->"
          body="$(gh release view "${RELEASE_TAG}" --json body --jq .body)"
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          is_prerelease="$(gh release view "${RELEASE_TAG}" --json isPrerelease --jq .isPrerelease)"
          if [[ "${body}" != *"${marker}"* || "${is_prerelease}" != 'false' ]]; then
            echo 'GitHub Release no longer matches the recovered stable release' >&2
            exit 1
          fi
          if [[ "${is_draft}" == 'false' ]]; then
            echo "GitHub Release is already published: ${RELEASE_TAG}"
            exit 0
          fi
          if [[ "${is_draft}" != 'true' ]]; then
            echo 'unable to determine GitHub Release state' >&2
            exit 1
          fi

          highest_version="$({
            gh release list --limit 1000 --json tagName,isDraft,isPrerelease \
              --jq '.[] | select((.isDraft == false) and (.isPrerelease == false)) | .tagName' \
              | sed --quiet --regexp-extended \
                's/^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$/\1/p'
            echo "${version}"
          } | sort --version-sort | tail -n 1)"
          if [[ "${highest_version}" == "${version}" ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false --latest
          else
            gh release edit "${RELEASE_TAG}" --draft=false --latest=false
            echo "not marking ${RELEASE_TAG} latest; highest stable version is ${highest_version}"
          fi
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = false

  license:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check licenses
        run: bash hack/check_licenses.sh

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
            BUILD_DATE=unknown
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.build-metadata.outputs.version }}
      stable: ${{ steps.build-metadata.outputs.stable }}
      prerelease: ${{ steps.build-metadata.outputs.prerelease }}
      publish_major: ${{ steps.build-metadata.outputs.publish_major }}
      build_date: ${{ steps.build-metadata.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify build metadata
        id: build-metadata
        shell: bash
        run: |
          version=edge
          stable=false
          prerelease=false
          publish_major=false

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
            if [[ ! "${GITHUB_REF_NAME}" =~ ${semver_pattern} ]]; then
              echo "tag must be a SemVer without build metadata: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi

            major="${BASH_REMATCH[1]}"
            prerelease_value="${BASH_REMATCH[5]}"
            if [[ -n "${prerelease_value}" ]]; then
              prerelease=true
              IFS='.' read -r -a identifiers <<< "${prerelease_value}"
              for identifier in "${identifiers[@]}"; do
                if [[ "${identifier}" =~ ^0[0-9]+$ ]]; then
                  echo "numeric prerelease identifiers must not contain leading zeroes" >&2
                  exit 1
                fi
              done
            else
              stable=true
              if [[ "${major}" != "0" ]]; then
                publish_major=true
              fi
            fi
            version="${GITHUB_REF_NAME#v}"
          fi

          source_epoch="$(git show -s --format='%ct' "${GITHUB_SHA}")"
          {
            echo "version=${version}"
            echo "stable=${stable}"
            echo "prerelease=${prerelease}"
            echo "publish_major=${publish_major}"
            echo "build_date=$(date -u -d "@${source_epoch}" +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "${GITHUB_OUTPUT}"

  reserve-release:
    if: github.ref_type == 'tag'
    needs: [license, prepare]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reserve or adopt draft GitHub Release
        shell: bash
        run: |
          marker="<!-- image-updater-release application commit=${GITHUB_SHA} version=${VERSION} -->"

          set +e
          release_output="$(gh release view "${GITHUB_REF_NAME}" 2>&1)"
          release_status=$?
          set -e
          if [[ ${release_status} -eq 0 ]]; then
            is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)"
            body="$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)"
            if [[ "${is_draft}" != "true" || "${body}" != *"${marker}"* ]]; then
              echo "existing GitHub Release is not this workflow's matching draft" >&2
              exit 1
            fi
            echo "adopting matching draft GitHub Release: ${GITHUB_REF_NAME}"
            exit 0
          fi
          if ! grep --fixed-strings --ignore-case --quiet 'release not found' <<< "${release_output}"; then
            echo "unable to verify that the GitHub Release is unused" >&2
            echo "${release_output}" >&2
            exit 1
          fi

          set +e
          image_output="$(docker manifest inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}" 2>&1)"
          image_status=$?
          set -e
          if [[ ${image_status} -eq 0 ]]; then
            echo "container image exists without a matching reserved release: ${VERSION}" >&2
            exit 1
          fi
          if ! grep --extended-regexp --ignore-case --quiet \
            'manifest unknown|no such manifest|not found' <<< "${image_output}"; then
            echo "unable to verify that the container image version is unused" >&2
            echo "${image_output}" >&2
            exit 1
          fi

          previous_tag="$(gh release list --limit 1000 --json tagName,isDraft \
            --jq '[.[] | select((.isDraft == false) and (.tagName | startswith("v")))][0].tagName // ""')"
          release_args=(
            "${GITHUB_REF_NAME}"
            --draft
            --verify-tag
            --title "image-updater ${GITHUB_REF_NAME}"
          )
          if [[ -n "${previous_tag}" ]]; then
            release_args+=(--generate-notes --notes-start-tag "${previous_tag}" --notes "${marker}")
          else
            release_args+=(--notes "${marker}"$'\n\n''Initial application release.')
          fi
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"

  publish:
    needs: [license, prepare, reserve-release]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.license.result == 'success' &&
      needs.prepare.result == 'success' &&
      (github.ref_type == 'branch' || needs.reserve-release.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=sha,format=long,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve exact application image
        if: github.ref_type == 'tag'
        id: exact-image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          set +e
          lookup_output="$(docker manifest inspect "${image}" 2>&1)"
          lookup_status=$?
          set -e
          if [[ ${lookup_status} -ne 0 ]]; then
            if grep --extended-regexp --ignore-case --quiet \
              'manifest unknown|no such manifest|not found' <<< "${lookup_output}"; then
              echo 'build=true' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "unable to resolve the exact application image" >&2
            echo "${lookup_output}" >&2
            exit 1
          fi

          for platform in linux/amd64 linux/arm64; do
            docker pull --quiet --platform "${platform}" "${image}" >/dev/null
            revision="$(docker image inspect "${image}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            image_version="$(docker image inspect "${image}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            if [[ "${revision}" != "${GITHUB_SHA}" || "${image_version}" != "${VERSION}" ]]; then
              echo "existing image does not belong to this release (${platform})" >&2
              exit 1
            fi
          done
          echo "adopting matching application image: ${image}"
          echo 'build=false' >> "${GITHUB_OUTPUT}"

      - name: Build and publish
        if: github.ref_type == 'branch' || steps.exact-image.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.created=${{ needs.prepare.outputs.build_date }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify exact application image
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          for platform in linux/amd64 linux/arm64; do
            docker pull --quiet --platform "${platform}" "${image}" >/dev/null
            revision="$(docker image inspect "${image}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            image_version="$(docker image inspect "${image}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            if [[ "${revision}" != "${GITHUB_SHA}" || "${image_version}" != "${VERSION}" ]]; then
              echo "published image identity mismatch (${platform})" >&2
              exit 1
            fi
          done

      - name: Update stable image aliases without regression
        if: needs.prepare.outputs.stable == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_MAJOR: ${{ needs.prepare.outputs.publish_major }}
        shell: bash
        run: |
          exact_image="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          minor="${VERSION%.*}"
          major="${VERSION%%.*}"
          aliases=("${minor}" latest)
          if [[ "${PUBLISH_MAJOR}" == "true" ]]; then
            aliases+=("${major}")
          fi

          stable_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          for alias in "${aliases[@]}"; do
            alias_image="${REGISTRY}/${IMAGE_NAME}:${alias}"
            set +e
            lookup_output="$(docker manifest inspect "${alias_image}" 2>&1)"
            lookup_status=$?
            set -e
            if [[ ${lookup_status} -eq 0 ]]; then
              docker pull --quiet --platform linux/amd64 "${alias_image}" >/dev/null
              current_version="$(docker image inspect "${alias_image}" \
                --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
              if [[ ! "${current_version}" =~ ${stable_pattern} ]]; then
                echo "existing alias has invalid version metadata: ${alias_image}" >&2
                exit 1
              fi
              highest="$(printf '%s\n%s\n' "${current_version}" "${VERSION}" | sort --version-sort | tail -n 1)"
              if [[ "${highest}" != "${VERSION}" ]]; then
                echo "not regressing ${alias_image} from ${current_version} to ${VERSION}"
                continue
              fi
            elif ! grep --extended-regexp --ignore-case --quiet \
              'manifest unknown|no such manifest|not found' <<< "${lookup_output}"; then
              echo "unable to resolve image alias: ${alias_image}" >&2
              echo "${lookup_output}" >&2
              exit 1
            fi
            docker buildx imagetools create --tag "${alias_image}" "${exact_image}"
          done

  finalize-release:
    if: github.ref_type == 'tag'
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Publish GitHub Release
        shell: bash
        run: |
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest=false
            exit 0
          fi

          highest_version="$({
            gh release list --limit 1000 --json tagName,isDraft,isPrerelease \
              --jq '.[] | select((.isDraft == false) and (.isPrerelease == false)) | .tagName' \
              | sed --quiet --regexp-extended 's/^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$/\1/p'
            echo "${VERSION}"
          } | sort --version-sort | tail -n 1)"
          if [[ "${highest_version}" == "${VERSION}" ]]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
          else
            gh release edit "${GITHUB_REF_NAME}" --draft=false --latest=false
            echo "not marking ${GITHUB_REF_NAME} latest; highest stable version is ${highest_version}"
          fi
