name: Helm

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'charts/**'
      - 'example/values.example.yaml'
      - 'README.md'
      - '.github/workflows/helm.yml'
  push:
    branches: [master]
    paths:
      - 'charts/**'
      - 'example/values.example.yaml'
      - 'README.md'
      - '.github/workflows/helm.yml'

permissions:
  contents: read

concurrency:
  group: helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        helm-version: [v3.21.4, v4.2.4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm-version }}

      - name: Lint chart
        run: helm lint charts/image-updater --strict --values charts/image-updater/ci/test-values.yaml

      - name: Render inline configuration
        run: >-
          helm template image-updater charts/image-updater
          --namespace image-updater
          --values charts/image-updater/ci/test-values.yaml
          > "${RUNNER_TEMP}/image-updater-inline.yaml"

      - name: Render existing ConfigMap configuration
        run: >-
          helm template image-updater charts/image-updater
          --namespace image-updater
          --values charts/image-updater/ci/test-values.yaml
          --set-json 'config.inline={}'
          --set-string config.existingConfigMap=image-updater-rules
          > "${RUNNER_TEMP}/image-updater-existing-configmap.yaml"

      - name: Render external ServiceAccount configuration
        run: >-
          helm template image-updater charts/image-updater
          --namespace image-updater
          --values charts/image-updater/ci/test-values.yaml
          --set serviceAccount.create=false
          --set-string serviceAccount.name=image-updater
          --set-json 'serviceAccount.annotations={}'
          > "${RUNNER_TEMP}/image-updater-external-serviceaccount.yaml"

      - name: Validate documented values
        run: |
          helm lint charts/image-updater --strict --values example/values.example.yaml
          helm template image-updater charts/image-updater \
            --namespace image-updater \
            --values example/values.example.yaml \
            > "${RUNNER_TEMP}/image-updater-example.yaml"

      - name: Assert rendered configuration contract
        run: |
          inline_manifest="${RUNNER_TEMP}/image-updater-inline.yaml"
          external_manifest="${RUNNER_TEMP}/image-updater-existing-configmap.yaml"

          grep --fixed-strings --quiet '{{.Environment}}' "${inline_manifest}"
          test "$(grep --line-regexp --count 'kind: ConfigMap' "${inline_manifest}")" -eq 1

          assert_env() {
            local name="$1"
            local value="$2"
            grep --after-context=1 -- "- name: ${name}" "${inline_manifest}" \
              | grep --fixed-strings --quiet "value: ${value}"
          }
          assert_env LOG_LEVEL '"info"'
          assert_env INTERVAL '"10s"'
          assert_env CONCURRENCY '"10"'
          assert_env SHUTDOWN_TIMEOUT '"30s"'
          assert_env IMAGE_LABEL_ANNOTATION_ENABLED '"false"'
          assert_env IMAGE_MANIFEST_INDENT '"2"'

          grep --after-context=10 -- '- name: github-private-key' "${inline_manifest}" \
            | grep --fixed-strings --quiet 'secretName: "image-updater-github"'
          grep --after-context=10 -- '- name: github-private-key' "${inline_manifest}" \
            | grep --fixed-strings --quiet -- '- key: "private-key.pem"'

          if grep --line-regexp --quiet 'kind: ConfigMap' "${external_manifest}"; then
            echo 'generated ConfigMap was rendered in external ConfigMap mode' >&2
            exit 1
          fi
          grep --fixed-strings --quiet 'name: "image-updater-rules"' "${external_manifest}"

      - name: Reject invalid values
        run: |
          helm template image-updater charts/image-updater \
            --namespace image-updater \
            --values charts/image-updater/ci/test-values.yaml \
            --set settings.intervalSeconds=0 \
            > "${RUNNER_TEMP}/image-updater-zero-interval.yaml"
          if helm lint charts/image-updater --strict \
            --values charts/image-updater/ci/test-values.yaml \
            --set-string config.existingConfigMap=image-updater-rules; then
            echo 'inline and existing ConfigMap sources were both accepted' >&2
            exit 1
          fi
          if helm lint charts/image-updater --strict \
            --values charts/image-updater/ci/test-values.yaml \
            --set-json 'config.inline={}'; then
            echo 'missing ConfigMap source was accepted' >&2
            exit 1
          fi
          if helm lint charts/image-updater --strict \
            --values charts/image-updater/ci/test-values.yaml \
            --set-json 'config.inline={"typo":"accepted"}'; then
            echo 'inline config without rules was accepted' >&2
            exit 1
          fi
          for secret_path in github.secretKeyRef.name github.secretKeyRef.key; do
            if helm lint charts/image-updater --strict \
              --values charts/image-updater/ci/test-values.yaml \
              --set-string "${secret_path}="; then
              echo "empty Secret reference was accepted at ${secret_path}" >&2
              exit 1
            fi
          done
          if helm lint charts/image-updater --strict \
            --values charts/image-updater/ci/test-values.yaml \
            --set-string github.secretKeyRef.key='invalid key'; then
            echo 'invalid Secret key was accepted' >&2
            exit 1
          fi
          for legacy_path in \
            config.data \
            runtime.intervalSeconds \
            github.existingSecret \
            github.privateKeyKey; do
            if helm lint charts/image-updater --strict \
              --values charts/image-updater/ci/test-values.yaml \
              --set-string "${legacy_path}=legacy"; then
              echo "legacy value was accepted at ${legacy_path}" >&2
              exit 1
            fi
          done
          if helm lint charts/image-updater --strict \
            --values charts/image-updater/ci/test-values.yaml \
            --set settings.intervalSeconds=86401; then
            echo 'out-of-range interval was accepted' >&2
            exit 1
          fi
          if helm lint charts/image-updater --strict \
            --values charts/image-updater/ci/test-values.yaml \
            --set settings.shutdownTimeoutSeconds=0; then
            echo 'zero shutdown timeout was accepted' >&2
            exit 1
          fi
          if helm template image-updater charts/image-updater \
            --values charts/image-updater/ci/test-values.yaml \
            --set settings.shutdownTimeoutSeconds=45 \
            --set terminationGracePeriodSeconds=45; then
            echo 'shutdown timeout without a grace margin was accepted' >&2
            exit 1
          fi
          printf -v valid_key 'a%.0s' {1..253}
          helm template image-updater charts/image-updater \
            --namespace image-updater \
            --values charts/image-updater/ci/test-values.yaml \
            --set-string config.key="${valid_key}" \
            > "${RUNNER_TEMP}/image-updater-max-length-key.yaml"
          if helm lint charts/image-updater --strict \
            --values charts/image-updater/ci/test-values.yaml \
            --set-string config.key="${valid_key}a"; then
            echo 'overlong ConfigMap key was accepted' >&2
            exit 1
          fi
          if helm lint charts/image-updater --strict \
            --values charts/image-updater/ci/test-values.yaml \
            --set-string config.key='invalid key'; then
            echo 'invalid ConfigMap key was accepted' >&2
            exit 1
          fi
          overlong_name="${valid_key}a"
          if helm lint charts/image-updater --strict \
            --values charts/image-updater/ci/test-values.yaml \
            --set-json 'config.inline={}' \
            --set-string config.existingConfigMap="${overlong_name}"; then
            echo 'overlong ConfigMap name was accepted' >&2
            exit 1
          fi
          for name_path in \
            github.secretKeyRef.name \
            'imagePullSecrets[0].name' \
            serviceAccount.name \
            priorityClassName; do
            if helm lint charts/image-updater --strict \
              --values charts/image-updater/ci/test-values.yaml \
              --set-string "${name_path}=${overlong_name}"; then
              echo "overlong Kubernetes name was accepted at ${name_path}" >&2
              exit 1
            fi
          done
          printf -v valid_label 'a%.0s' {1..63}
          overlong_label="${valid_label}a"
          for override_path in nameOverride fullnameOverride; do
            helm template image-updater charts/image-updater \
              --values charts/image-updater/ci/test-values.yaml \
              --set-string "${override_path}=${valid_label}" \
              > "${RUNNER_TEMP}/image-updater-valid-override.yaml"
            if helm lint charts/image-updater --strict \
              --values charts/image-updater/ci/test-values.yaml \
              --set-string "${override_path}=${overlong_label}"; then
              echo "overlong generated name was accepted at ${override_path}" >&2
              exit 1
            fi
          done

      - name: Package chart
        run: helm package charts/image-updater --destination "${RUNNER_TEMP}"
