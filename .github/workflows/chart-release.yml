name: Helm chart release

on:
  push:
    tags: ['chart-v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing chart release tag to recover
        required: true
        type: string
      expected_commit:
        description: Full commit SHA peeled from the existing annotated tag
        required: true
        type: string
      expected_asset_digest:
        description: Existing chart asset digest (sha256:<64 lowercase hex>)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chart-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository }}
  CHART_PATH: charts/image-updater
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART_REFERENCE: oci://ghcr.io/${{ github.repository_owner }}/charts/image-updater

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      chart_version: ${{ steps.metadata.outputs.chart_version }}
      app_version: ${{ steps.metadata.outputs.app_version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          chart_version="$(awk -F': *' '$1 == "version" { print $2; exit }' "${CHART_PATH}/Chart.yaml")"
          app_version="$(awk -F': *' '$1 == "appVersion" { print $2; exit }' "${CHART_PATH}/Chart.yaml")"
          chart_version="${chart_version#\"}"
          chart_version="${chart_version%\"}"
          chart_version="${chart_version#\'}"
          chart_version="${chart_version%\'}"
          app_version="${app_version#\"}"
          app_version="${app_version%\"}"
          app_version="${app_version#\'}"
          app_version="${app_version%\'}"
          tag_version="${GITHUB_REF_NAME#chart-v}"

          validate_semver() {
            local value="$1"
            local label="$2"
            local semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
            if [[ ! "${value}" =~ ${semver_pattern} ]]; then
              echo "${label} must be an exact SemVer without build metadata: ${value}" >&2
              exit 1
            fi
            local prerelease_value="${BASH_REMATCH[5]}"
            if [[ -n "${prerelease_value}" ]]; then
              IFS='.' read -r -a identifiers <<< "${prerelease_value}"
              for identifier in "${identifiers[@]}"; do
                if [[ "${identifier}" =~ ^0[0-9]+$ ]]; then
                  echo "numeric prerelease identifiers must not contain leading zeroes" >&2
                  exit 1
                fi
              done
            fi
          }

          validate_semver "${chart_version}" 'Chart version'
          validate_semver "${app_version}" 'Chart appVersion'
          if [[ "${tag_version}" != "${chart_version}" ]]; then
            echo "tag version ${tag_version} does not match Chart version ${chart_version}" >&2
            exit 1
          fi

          prerelease=false
          if [[ "${chart_version}" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "chart_version=${chart_version}"
            echo "app_version=${app_version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify application image
        env:
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        run: docker manifest inspect "${APP_IMAGE}:${APP_VERSION}" >/dev/null

      - name: Validate chart
        env:
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        run: |
          helm lint "${CHART_PATH}" --strict --values "${CHART_PATH}/ci/test-values.yaml"
          helm template image-updater "${CHART_PATH}" \
            --namespace image-updater \
            --values "${CHART_PATH}/ci/test-values.yaml" \
            > "${RUNNER_TEMP}/image-updater.yaml"
          grep --fixed-strings --quiet \
            "image: \"${APP_IMAGE}:${APP_VERSION}\"" \
            "${RUNNER_TEMP}/image-updater.yaml"

  reserve-release:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHART_VERSION: ${{ needs.validate.outputs.chart_version }}
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Log in to GHCR
        run: >-
          printf '%s' "${GH_TOKEN}" |
          helm registry login "${REGISTRY}"
          --username "${GITHUB_ACTOR}"
          --password-stdin

      - name: Reserve or adopt draft GitHub Release
        shell: bash
        run: |
          marker="<!-- image-updater-release chart commit=${GITHUB_SHA} chart=${CHART_VERSION} app=${APP_VERSION} -->"

          set +e
          release_output="$(gh release view "${GITHUB_REF_NAME}" 2>&1)"
          release_status=$?
          set -e
          if [[ ${release_status} -eq 0 ]]; then
            is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)"
            body="$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)"
            if [[ "${is_draft}" != "true" || "${body}" != *"${marker}"* ]]; then
              echo "existing GitHub Release is not this workflow's matching draft" >&2
              exit 1
            fi
            echo "adopting matching draft GitHub Release: ${GITHUB_REF_NAME}"
            exit 0
          fi
          if ! grep --fixed-strings --ignore-case --quiet 'release not found' <<< "${release_output}"; then
            echo "unable to verify that the GitHub Release is unused" >&2
            echo "${release_output}" >&2
            exit 1
          fi

          set +e
          chart_output="$(helm show chart "${CHART_REFERENCE}" --version "${CHART_VERSION}" 2>&1)"
          chart_status=$?
          set -e
          if [[ ${chart_status} -eq 0 ]]; then
            echo "OCI chart exists without a matching reserved release: ${CHART_VERSION}" >&2
            exit 1
          fi
          if ! grep --extended-regexp --ignore-case --quiet \
            'manifest unknown|name unknown|not found' <<< "${chart_output}"; then
            echo "unable to verify that the OCI chart version is unused" >&2
            echo "${chart_output}" >&2
            exit 1
          fi

          previous_tag="$(gh release list --limit 1000 --json tagName,isDraft \
            --jq '[.[] | select((.isDraft == false) and (.tagName | startswith("chart-v")))][0].tagName // ""')"
          release_args=(
            "${GITHUB_REF_NAME}"
            --draft
            --verify-tag
            --title "Helm chart ${CHART_VERSION}"
          )
          if [[ -n "${previous_tag}" ]]; then
            release_args+=(--generate-notes --notes-start-tag "${previous_tag}" --notes "${marker}")
          else
            release_args+=(--notes "${marker}"$'\n\n''Initial Helm chart release.')
          fi
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"

  package-chart:
    if: github.event_name == 'push'
    needs: [validate, reserve-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      artifact_id: ${{ steps.upload-chart.outputs.artifact-id }}
      package_digest: ${{ steps.package.outputs.package_digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHART_VERSION: ${{ needs.validate.outputs.chart_version }}
      ASSET_NAME: image-updater-${{ needs.validate.outputs.chart_version }}.tgz
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Package or adopt and validate chart asset
        id: package
        shell: bash
        run: |
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" = true
          asset_count="$(gh release view "${GITHUB_REF_NAME}" --json assets \
            --jq '[.assets[] | select(.name == env.ASSET_NAME)] | length')"
          if [[ "${asset_count}" == "1" ]]; then
            echo "adopting existing chart asset: ${ASSET_NAME}"
            gh release download "${GITHUB_REF_NAME}" \
              --pattern "${ASSET_NAME}" \
              --dir "${RUNNER_TEMP}"
          elif [[ "${asset_count}" == "0" ]]; then
            helm package "${CHART_PATH}" --destination "${RUNNER_TEMP}"
          else
            echo "unexpected number of matching chart assets: ${asset_count}" >&2
            exit 1
          fi

          bash hack/check_chart_package.sh \
            "${RUNNER_TEMP}/${ASSET_NAME}" \
            "${CHART_PATH}"

          if [[ "${asset_count}" == "0" ]]; then
            gh release upload "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/${ASSET_NAME}"
          fi

          package_digest="sha256:$(sha256sum "${RUNNER_TEMP}/${ASSET_NAME}" | cut -d ' ' -f 1)"
          echo "package_digest=${package_digest}" >> "${GITHUB_OUTPUT}"

      - name: Upload validated chart package for publisher
        id: upload-chart
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chart-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.ASSET_NAME }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-chart:
    if: github.event_name == 'push'
    needs: [validate, package-chart]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHART_VERSION: ${{ needs.validate.outputs.chart_version }}
      ASSET_NAME: image-updater-${{ needs.validate.outputs.chart_version }}.tgz
      EXPECTED_PACKAGE_DIGEST: ${{ needs.package-chart.outputs.package_digest }}
    steps:
      - name: Download validated chart package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.package-chart.outputs.artifact_id }}
          path: ${{ runner.temp }}
          merge-multiple: true

      - name: Verify transferred chart package digest
        shell: bash
        run: |
          actual_digest="sha256:$(sha256sum "${RUNNER_TEMP}/${ASSET_NAME}" | cut -d ' ' -f 1)"
          if [[ "${actual_digest}" != "${EXPECTED_PACKAGE_DIGEST}" ]]; then
            echo "transferred chart package digest mismatch" >&2
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Log in to GHCR
        run: >-
          printf '%s' "${GH_TOKEN}" |
          helm registry login "${REGISTRY}"
          --username "${GITHUB_ACTOR}"
          --password-stdin

      - name: Resolve exact OCI chart
        id: exact-chart
        shell: bash
        run: |
          set +e
          lookup_output="$(helm show chart "${CHART_REFERENCE}" --version "${CHART_VERSION}" 2>&1)"
          lookup_status=$?
          set -e
          if [[ ${lookup_status} -ne 0 ]]; then
            if grep --extended-regexp --ignore-case --quiet \
              'manifest unknown|name unknown|not found' <<< "${lookup_output}"; then
              echo 'publish=true' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "unable to resolve the exact OCI chart" >&2
            echo "${lookup_output}" >&2
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/existing"
          helm pull "${CHART_REFERENCE}" \
            --version "${CHART_VERSION}" \
            --destination "${RUNNER_TEMP}/existing"
          if ! cmp --silent \
            "${RUNNER_TEMP}/${ASSET_NAME}" \
            "${RUNNER_TEMP}/existing/${ASSET_NAME}"; then
            echo "existing OCI chart does not match the reserved GitHub asset" >&2
            exit 1
          fi
          echo "adopting matching OCI chart: ${CHART_REFERENCE}:${CHART_VERSION}"
          echo 'publish=false' >> "${GITHUB_OUTPUT}"

      - name: Publish OCI chart
        if: steps.exact-chart.outputs.publish == 'true'
        run: helm push "${RUNNER_TEMP}/${ASSET_NAME}" "${CHART_REGISTRY}"

      - name: Verify OCI chart matches GitHub asset
        run: |
          mkdir -p "${RUNNER_TEMP}/verified"
          helm pull "${CHART_REFERENCE}" \
            --version "${CHART_VERSION}" \
            --destination "${RUNNER_TEMP}/verified"
          cmp --silent \
            "${RUNNER_TEMP}/${ASSET_NAME}" \
            "${RUNNER_TEMP}/verified/${ASSET_NAME}"

  finalize-release:
    if: github.event_name == 'push'
    needs: [validate, publish-chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish GitHub Release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest=false

  validate-chart-release-recovery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    outputs:
      chart_version: ${{ steps.metadata.outputs.chart_version }}
      app_version: ${{ steps.metadata.outputs.app_version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      tag_object: ${{ steps.metadata.outputs.tag_object }}
      release_id: ${{ steps.release.outputs.release_id }}
      asset_id: ${{ steps.release.outputs.asset_id }}
      asset_size: ${{ steps.release.outputs.asset_size }}
      package_digest: ${{ steps.release.outputs.package_digest }}
      artifact_id: ${{ steps.upload-chart.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_ASSET_DIGEST: ${{ inputs.expected_asset_digest }}
    steps:
      - name: Checkout reviewed recovery workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Authorize recovery and validate annotated tag
        id: metadata
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "chart recovery must run from the default branch" >&2
            exit 1
          fi
          if [[ ! "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ ! "${EXPECTED_ASSET_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "expected_asset_digest must be sha256 followed by 64 lowercase hex characters" >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG}" != chart-v* ]]; then
            echo "release_tag must start with chart-v" >&2
            exit 1
          fi
          tag_version="${RELEASE_TAG#chart-v}"

          validate_semver() {
            local value="$1"
            local label="$2"
            local semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
            if [[ ! "${value}" =~ ${semver_pattern} ]]; then
              echo "${label} must be an exact SemVer without build metadata: ${value}" >&2
              exit 1
            fi
            local prerelease_value="${BASH_REMATCH[5]}"
            if [[ -n "${prerelease_value}" ]]; then
              IFS='.' read -r -a identifiers <<< "${prerelease_value}"
              for identifier in "${identifiers[@]}"; do
                if [[ "${identifier}" =~ ^0[0-9]+$ ]]; then
                  echo "numeric prerelease identifiers must not contain leading zeroes" >&2
                  exit 1
                fi
              done
            fi
          }

          validate_semver "${tag_version}" 'Release tag version'
          git fetch --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/recovery/chart-release"
          tag_type="$(git cat-file -t refs/recovery/chart-release)"
          if [[ "${tag_type}" != "tag" ]]; then
            echo "release tag must be annotated" >&2
            exit 1
          fi
          tag_object="$(git rev-parse 'refs/recovery/chart-release^{tag}')"
          peeled_commit="$(git rev-parse 'refs/recovery/chart-release^{commit}')"
          if [[ "${peeled_commit}" != "${EXPECTED_COMMIT}" ]]; then
            echo "annotated tag does not peel to expected_commit" >&2
            exit 1
          fi

          tagged_source="${RUNNER_TEMP}/tagged-source"
          mkdir -p "${tagged_source}"
          git archive "${peeled_commit}" charts/image-updater | tar -x -C "${tagged_source}"
          tagged_chart="${tagged_source}/${CHART_PATH}/Chart.yaml"
          chart_version="$(awk -F': *' '$1 == "version" { print $2; exit }' "${tagged_chart}")"
          app_version="$(awk -F': *' '$1 == "appVersion" { print $2; exit }' "${tagged_chart}")"
          chart_version="${chart_version#\"}"
          chart_version="${chart_version%\"}"
          chart_version="${chart_version#\'}"
          chart_version="${chart_version%\'}"
          app_version="${app_version#\"}"
          app_version="${app_version%\"}"
          app_version="${app_version#\'}"
          app_version="${app_version%\'}"
          validate_semver "${chart_version}" 'Tagged Chart version'
          validate_semver "${app_version}" 'Tagged Chart appVersion'
          if [[ "${chart_version}" != "${tag_version}" ]]; then
            echo "tagged Chart version does not match release_tag" >&2
            exit 1
          fi

          prerelease=false
          if [[ "${chart_version}" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "chart_version=${chart_version}"
            echo "app_version=${app_version}"
            echo "prerelease=${prerelease}"
            echo "tag_object=${tag_object}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate and download immutable draft asset
        id: release
        shell: bash
        env:
          CHART_VERSION: ${{ steps.metadata.outputs.chart_version }}
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
          IS_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          ASSET_NAME: image-updater-${{ steps.metadata.outputs.chart_version }}.tgz
        run: |
          marker="<!-- image-updater-release chart commit=${EXPECTED_COMMIT} chart=${CHART_VERSION} app=${APP_VERSION} -->"
          title="Helm chart ${CHART_VERSION}"
          releases_json="${RUNNER_TEMP}/releases.json"
          release_json="${RUNNER_TEMP}/release.json"
          snapshot_json="${RUNNER_TEMP}/release-snapshot.json"
          package_path="${RUNNER_TEMP}/${ASSET_NAME}"

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "${releases_json}"
          release_count="$(jq --arg tag "${RELEASE_TAG}" \
            '[.[][] | select(.tag_name == $tag)] | length' "${releases_json}")"
          if [[ "${release_count}" != "1" ]]; then
            echo "expected exactly one existing Release for ${RELEASE_TAG}, found ${release_count}" >&2
            exit 1
          fi
          jq --arg tag "${RELEASE_TAG}" \
            '[.[][] | select(.tag_name == $tag)][0]' \
            "${releases_json}" > "${release_json}"
          jq -e --arg tag "${RELEASE_TAG}" --arg title "${title}" --arg marker "${marker}" --arg asset "${ASSET_NAME}" --arg digest "${EXPECTED_ASSET_DIGEST}" --argjson prerelease "${IS_PRERELEASE}" '.id > 0 and .tag_name == $tag and .name == $title and ((.body // "") | contains($marker)) and .prerelease == $prerelease and ((.draft == true) or (.draft == false)) and (.assets | length == 1) and .assets[0].name == $asset and .assets[0].state == "uploaded" and .assets[0].size > 0 and .assets[0].digest == $digest' "${release_json}" >/dev/null

          release_id="$(jq -r '.id' "${release_json}")"
          release_draft="$(jq -r '.draft' "${release_json}")"
          asset_id="$(jq -r '.assets[0].id' "${release_json}")"
          asset_size="$(jq -r '.assets[0].size' "${release_json}")"
          gh api \
            -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            > "${package_path}"

          actual_size="$(stat --format='%s' "${package_path}")"
          package_digest="sha256:$(sha256sum "${package_path}" | cut -d ' ' -f 1)"
          if [[ "${actual_size}" != "${asset_size}" ]]; then
            echo "downloaded chart asset size mismatch" >&2
            exit 1
          fi
          if [[ "${package_digest}" != "${EXPECTED_ASSET_DIGEST}" ]]; then
            echo "downloaded chart asset digest mismatch" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "${snapshot_json}"
          jq -e --argjson release_id "${release_id}" --argjson asset_id "${asset_id}" --argjson asset_size "${asset_size}" --arg tag "${RELEASE_TAG}" --arg title "${title}" --arg marker "${marker}" --arg asset "${ASSET_NAME}" --arg digest "${EXPECTED_ASSET_DIGEST}" --argjson prerelease "${IS_PRERELEASE}" --argjson draft "${release_draft}" '.id == $release_id and .tag_name == $tag and .name == $title and ((.body // "") | contains($marker)) and .prerelease == $prerelease and .draft == $draft and (.assets | length == 1) and .assets[0].id == $asset_id and .assets[0].name == $asset and .assets[0].state == "uploaded" and .assets[0].size == $asset_size and .assets[0].digest == $digest' "${snapshot_json}" >/dev/null

          {
            echo "release_id=${release_id}"
            echo "asset_id=${asset_id}"
            echo "asset_size=${asset_size}"
            echo "package_digest=${package_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate recovered chart package
        shell: bash
        env:
          CHART_VERSION: ${{ steps.metadata.outputs.chart_version }}
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
          ASSET_NAME: image-updater-${{ steps.metadata.outputs.chart_version }}.tgz
        run: |
          package_path="${RUNNER_TEMP}/${ASSET_NAME}"
          tagged_chart_path="${RUNNER_TEMP}/tagged-source/${CHART_PATH}"
          bash hack/check_chart_package.sh "${package_path}" "${tagged_chart_path}"
          helm show chart "${package_path}" > "${RUNNER_TEMP}/package-metadata.yaml"
          package_name="$(awk -F': *' '$1 == "name" { print $2; exit }' "${RUNNER_TEMP}/package-metadata.yaml")"
          package_version="$(awk -F': *' '$1 == "version" { print $2; exit }' "${RUNNER_TEMP}/package-metadata.yaml")"
          package_app_version="$(awk -F': *' '$1 == "appVersion" { print $2; exit }' "${RUNNER_TEMP}/package-metadata.yaml")"
          package_app_version="${package_app_version#\"}"
          package_app_version="${package_app_version%\"}"
          if [[ "${package_name}" != "image-updater" || "${package_version}" != "${CHART_VERSION}" || "${package_app_version}" != "${APP_VERSION}" ]]; then
            echo "chart package metadata does not match the authorized release" >&2
            exit 1
          fi

          helm lint "${package_path}" --strict --values "${tagged_chart_path}/ci/test-values.yaml"
          helm template image-updater "${package_path}" \
            --namespace image-updater \
            --values "${tagged_chart_path}/ci/test-values.yaml" \
            > "${RUNNER_TEMP}/recovered-image-updater.yaml"
          grep --fixed-strings --quiet \
            "image: \"${APP_IMAGE}:${APP_VERSION}\"" \
            "${RUNNER_TEMP}/recovered-image-updater.yaml"

      - name: Verify published application Release
        shell: bash
        env:
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        run: |
          app_tag="v${APP_VERSION}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${app_tag}" \
            > "${RUNNER_TEMP}/application-release.json"
          jq -e --arg tag "${app_tag}" \
            '.tag_name == $tag and .draft == false and .published_at != null' \
            "${RUNNER_TEMP}/application-release.json" >/dev/null

      - name: Log in to GHCR for application verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published application image
        env:
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        run: docker manifest inspect "${APP_IMAGE}:${APP_VERSION}" >/dev/null

      - name: Upload verified recovery package
        id: upload-chart
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovered-chart-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-updater-${{ steps.metadata.outputs.chart_version }}.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  recover-chart:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-chart-release-recovery
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHART_VERSION: ${{ needs.validate-chart-release-recovery.outputs.chart_version }}
      ASSET_NAME: image-updater-${{ needs.validate-chart-release-recovery.outputs.chart_version }}.tgz
      VALIDATED_PACKAGE_DIGEST: ${{ needs.validate-chart-release-recovery.outputs.package_digest }}
      EXPECTED_ASSET_DIGEST: ${{ inputs.expected_asset_digest }}
    steps:
      - name: Download verified recovery package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.validate-chart-release-recovery.outputs.artifact_id }}
          path: ${{ runner.temp }}
          merge-multiple: true

      - name: Verify recovery package digest
        shell: bash
        run: |
          actual_digest="sha256:$(sha256sum "${RUNNER_TEMP}/${ASSET_NAME}" | cut -d ' ' -f 1)"
          if [[ "${actual_digest}" != "${VALIDATED_PACKAGE_DIGEST}" || "${actual_digest}" != "${EXPECTED_ASSET_DIGEST}" ]]; then
            echo "recovery package digest mismatch" >&2
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Log in to GHCR
        run: >-
          printf '%s' "${GH_TOKEN}" |
          helm registry login "${REGISTRY}"
          --username "${GITHUB_ACTOR}"
          --password-stdin

      - name: Resolve exact OCI chart
        id: exact-chart
        shell: bash
        run: |
          set +e
          lookup_output="$(helm show chart "${CHART_REFERENCE}" --version "${CHART_VERSION}" 2>&1)"
          lookup_status=$?
          set -e
          if [[ ${lookup_status} -ne 0 ]]; then
            if grep --extended-regexp --ignore-case --quiet \
              'manifest unknown|name unknown|not found' <<< "${lookup_output}"; then
              echo 'publish=true' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "unable to resolve the exact OCI chart" >&2
            echo "${lookup_output}" >&2
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/existing"
          helm pull "${CHART_REFERENCE}" \
            --version "${CHART_VERSION}" \
            --destination "${RUNNER_TEMP}/existing"
          if ! cmp --silent \
            "${RUNNER_TEMP}/${ASSET_NAME}" \
            "${RUNNER_TEMP}/existing/${ASSET_NAME}"; then
            echo "existing OCI chart does not match the immutable GitHub asset" >&2
            exit 1
          fi
          echo "adopting matching OCI chart: ${CHART_REFERENCE}:${CHART_VERSION}"
          echo 'publish=false' >> "${GITHUB_OUTPUT}"

      - name: Publish missing OCI chart
        if: steps.exact-chart.outputs.publish == 'true'
        run: helm push "${RUNNER_TEMP}/${ASSET_NAME}" "${CHART_REGISTRY}"

      - name: Verify OCI chart bytes
        run: |
          mkdir -p "${RUNNER_TEMP}/verified"
          helm pull "${CHART_REFERENCE}" \
            --version "${CHART_VERSION}" \
            --destination "${RUNNER_TEMP}/verified"
          cmp --silent \
            "${RUNNER_TEMP}/${ASSET_NAME}" \
            "${RUNNER_TEMP}/verified/${ASSET_NAME}"

  finalize-recovered-chart-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate-chart-release-recovery, recover-chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_ASSET_DIGEST: ${{ inputs.expected_asset_digest }}
      CHART_VERSION: ${{ needs.validate-chart-release-recovery.outputs.chart_version }}
      APP_VERSION: ${{ needs.validate-chart-release-recovery.outputs.app_version }}
      IS_PRERELEASE: ${{ needs.validate-chart-release-recovery.outputs.prerelease }}
      TAG_OBJECT: ${{ needs.validate-chart-release-recovery.outputs.tag_object }}
      RELEASE_ID: ${{ needs.validate-chart-release-recovery.outputs.release_id }}
      ASSET_ID: ${{ needs.validate-chart-release-recovery.outputs.asset_id }}
      ASSET_SIZE: ${{ needs.validate-chart-release-recovery.outputs.asset_size }}
      ASSET_NAME: image-updater-${{ needs.validate-chart-release-recovery.outputs.chart_version }}.tgz
    steps:
      - name: Publish the same validated GitHub Release
        shell: bash
        run: |
          marker="<!-- image-updater-release chart commit=${EXPECTED_COMMIT} chart=${CHART_VERSION} app=${APP_VERSION} -->"
          title="Helm chart ${CHART_VERSION}"
          release_json="${RUNNER_TEMP}/release.json"

          remote_tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          remote_tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type')"
          if [[ "${remote_tag_type}" != "tag" || "${remote_tag_object}" != "${TAG_OBJECT}" ]]; then
            echo "release tag identity changed after recovery authorization" >&2
            exit 1
          fi

          validate_release() {
            local expected_draft="$1"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "${release_json}"
            jq -e --argjson release_id "${RELEASE_ID}" --argjson asset_id "${ASSET_ID}" --argjson asset_size "${ASSET_SIZE}" --arg tag "${RELEASE_TAG}" --arg title "${title}" --arg marker "${marker}" --arg asset "${ASSET_NAME}" --arg digest "${EXPECTED_ASSET_DIGEST}" --argjson prerelease "${IS_PRERELEASE}" --argjson draft "${expected_draft}" '.id == $release_id and .tag_name == $tag and .name == $title and ((.body // "") | contains($marker)) and .prerelease == $prerelease and .draft == $draft and (.assets | length == 1) and .assets[0].id == $asset_id and .assets[0].name == $asset and .assets[0].state == "uploaded" and .assets[0].size == $asset_size and .assets[0].digest == $digest' "${release_json}" >/dev/null
          }

          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "${release_json}"
          current_draft="$(jq -r '.draft' "${release_json}")"
          if [[ "${current_draft}" != "true" && "${current_draft}" != "false" ]]; then
            echo "unexpected Release draft state" >&2
            exit 1
          fi
          validate_release "${current_draft}"
          if [[ "${current_draft}" == "false" ]]; then
            echo "adopting already-published matching Release: ${RELEASE_TAG}"
            exit 0
          fi

          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest=false \
            > /dev/null
          validate_release false
          jq -e '.published_at != null' "${release_json}" >/dev/null
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "${latest_tag}" == "${RELEASE_TAG}" ]]; then
            echo "chart Release unexpectedly became the latest repository Release" >&2
            exit 1
          fi
