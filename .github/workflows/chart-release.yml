name: Helm chart release

on:
  push:
    tags: ['chart-v*.*.*']

permissions:
  contents: read

concurrency:
  group: chart-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository }}
  CHART_PATH: charts/image-updater
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART_REFERENCE: oci://ghcr.io/${{ github.repository_owner }}/charts/image-updater

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      chart_version: ${{ steps.metadata.outputs.chart_version }}
      app_version: ${{ steps.metadata.outputs.app_version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          chart_version="$(awk -F': *' '$1 == "version" { print $2; exit }' "${CHART_PATH}/Chart.yaml")"
          app_version="$(awk -F': *' '$1 == "appVersion" { print $2; exit }' "${CHART_PATH}/Chart.yaml")"
          chart_version="${chart_version#\"}"
          chart_version="${chart_version%\"}"
          chart_version="${chart_version#\'}"
          chart_version="${chart_version%\'}"
          app_version="${app_version#\"}"
          app_version="${app_version%\"}"
          app_version="${app_version#\'}"
          app_version="${app_version%\'}"
          tag_version="${GITHUB_REF_NAME#chart-v}"

          validate_semver() {
            local value="$1"
            local label="$2"
            local semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
            if [[ ! "${value}" =~ ${semver_pattern} ]]; then
              echo "${label} must be an exact SemVer without build metadata: ${value}" >&2
              exit 1
            fi
            local prerelease_value="${BASH_REMATCH[5]}"
            if [[ -n "${prerelease_value}" ]]; then
              IFS='.' read -r -a identifiers <<< "${prerelease_value}"
              for identifier in "${identifiers[@]}"; do
                if [[ "${identifier}" =~ ^0[0-9]+$ ]]; then
                  echo "numeric prerelease identifiers must not contain leading zeroes" >&2
                  exit 1
                fi
              done
            fi
          }

          validate_semver "${chart_version}" 'Chart version'
          validate_semver "${app_version}" 'Chart appVersion'
          if [[ "${tag_version}" != "${chart_version}" ]]; then
            echo "tag version ${tag_version} does not match Chart version ${chart_version}" >&2
            exit 1
          fi

          prerelease=false
          if [[ "${chart_version}" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "chart_version=${chart_version}"
            echo "app_version=${app_version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify application image
        env:
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        run: docker manifest inspect "${APP_IMAGE}:${APP_VERSION}" >/dev/null

      - name: Validate chart
        env:
          APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        run: |
          helm lint "${CHART_PATH}" --strict --values "${CHART_PATH}/ci/test-values.yaml"
          helm template image-updater "${CHART_PATH}" \
            --namespace image-updater \
            --values "${CHART_PATH}/ci/test-values.yaml" \
            > "${RUNNER_TEMP}/image-updater.yaml"
          grep --fixed-strings --quiet \
            "image: \"${APP_IMAGE}:${APP_VERSION}\"" \
            "${RUNNER_TEMP}/image-updater.yaml"

  reserve-release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHART_VERSION: ${{ needs.validate.outputs.chart_version }}
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Log in to GHCR
        run: >-
          printf '%s' "${GH_TOKEN}" |
          helm registry login "${REGISTRY}"
          --username "${GITHUB_ACTOR}"
          --password-stdin

      - name: Reserve or adopt draft GitHub Release
        shell: bash
        run: |
          marker="<!-- image-updater-release chart commit=${GITHUB_SHA} chart=${CHART_VERSION} app=${APP_VERSION} -->"

          set +e
          release_output="$(gh release view "${GITHUB_REF_NAME}" 2>&1)"
          release_status=$?
          set -e
          if [[ ${release_status} -eq 0 ]]; then
            is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)"
            body="$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)"
            if [[ "${is_draft}" != "true" || "${body}" != *"${marker}"* ]]; then
              echo "existing GitHub Release is not this workflow's matching draft" >&2
              exit 1
            fi
            echo "adopting matching draft GitHub Release: ${GITHUB_REF_NAME}"
            exit 0
          fi
          if ! grep --fixed-strings --ignore-case --quiet 'release not found' <<< "${release_output}"; then
            echo "unable to verify that the GitHub Release is unused" >&2
            echo "${release_output}" >&2
            exit 1
          fi

          set +e
          chart_output="$(helm show chart "${CHART_REFERENCE}" --version "${CHART_VERSION}" 2>&1)"
          chart_status=$?
          set -e
          if [[ ${chart_status} -eq 0 ]]; then
            echo "OCI chart exists without a matching reserved release: ${CHART_VERSION}" >&2
            exit 1
          fi
          if ! grep --extended-regexp --ignore-case --quiet \
            'manifest unknown|name unknown|not found' <<< "${chart_output}"; then
            echo "unable to verify that the OCI chart version is unused" >&2
            echo "${chart_output}" >&2
            exit 1
          fi

          previous_tag="$(gh release list --limit 1000 --json tagName,isDraft \
            --jq '[.[] | select((.isDraft == false) and (.tagName | startswith("chart-v")))][0].tagName // ""')"
          release_args=(
            "${GITHUB_REF_NAME}"
            --draft
            --verify-tag
            --title "Helm chart ${CHART_VERSION}"
          )
          if [[ -n "${previous_tag}" ]]; then
            release_args+=(--generate-notes --notes-start-tag "${previous_tag}" --notes "${marker}")
          else
            release_args+=(--notes "${marker}"$'\n\n''Initial Helm chart release.')
          fi
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"

  package-chart:
    needs: [validate, reserve-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHART_VERSION: ${{ needs.validate.outputs.chart_version }}
      ASSET_NAME: image-updater-${{ needs.validate.outputs.chart_version }}.tgz
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Package or adopt and validate chart asset
        shell: bash
        run: |
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" = true
          asset_count="$(gh release view "${GITHUB_REF_NAME}" --json assets \
            --jq '[.assets[] | select(.name == env.ASSET_NAME)] | length')"
          if [[ "${asset_count}" == "1" ]]; then
            echo "adopting existing chart asset: ${ASSET_NAME}"
            gh release download "${GITHUB_REF_NAME}" \
              --pattern "${ASSET_NAME}" \
              --dir "${RUNNER_TEMP}"
          elif [[ "${asset_count}" == "0" ]]; then
            helm package "${CHART_PATH}" --destination "${RUNNER_TEMP}"
          else
            echo "unexpected number of matching chart assets: ${asset_count}" >&2
            exit 1
          fi

          bash hack/check_chart_package.sh \
            "${RUNNER_TEMP}/${ASSET_NAME}" \
            "${CHART_PATH}"

          if [[ "${asset_count}" == "0" ]]; then
            gh release upload "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/${ASSET_NAME}"
          fi

  publish-chart:
    needs: [validate, package-chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHART_VERSION: ${{ needs.validate.outputs.chart_version }}
      ASSET_NAME: image-updater-${{ needs.validate.outputs.chart_version }}.tgz
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Download reserved chart package
        run: >-
          gh release download "${GITHUB_REF_NAME}"
          --pattern "${ASSET_NAME}"
          --dir "${RUNNER_TEMP}"

      - name: Validate reserved chart package
        run: >-
          bash hack/check_chart_package.sh
          "${RUNNER_TEMP}/${ASSET_NAME}"
          "${CHART_PATH}"

      - name: Log in to GHCR
        run: >-
          printf '%s' "${GH_TOKEN}" |
          helm registry login "${REGISTRY}"
          --username "${GITHUB_ACTOR}"
          --password-stdin

      - name: Resolve exact OCI chart
        id: exact-chart
        shell: bash
        run: |
          set +e
          lookup_output="$(helm show chart "${CHART_REFERENCE}" --version "${CHART_VERSION}" 2>&1)"
          lookup_status=$?
          set -e
          if [[ ${lookup_status} -ne 0 ]]; then
            if grep --extended-regexp --ignore-case --quiet \
              'manifest unknown|name unknown|not found' <<< "${lookup_output}"; then
              echo 'publish=true' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "unable to resolve the exact OCI chart" >&2
            echo "${lookup_output}" >&2
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/existing"
          helm pull "${CHART_REFERENCE}" \
            --version "${CHART_VERSION}" \
            --destination "${RUNNER_TEMP}/existing"
          if ! cmp --silent \
            "${RUNNER_TEMP}/${ASSET_NAME}" \
            "${RUNNER_TEMP}/existing/${ASSET_NAME}"; then
            echo "existing OCI chart does not match the reserved GitHub asset" >&2
            exit 1
          fi
          echo "adopting matching OCI chart: ${CHART_REFERENCE}:${CHART_VERSION}"
          echo 'publish=false' >> "${GITHUB_OUTPUT}"

      - name: Publish OCI chart
        if: steps.exact-chart.outputs.publish == 'true'
        run: helm push "${RUNNER_TEMP}/${ASSET_NAME}" "${CHART_REGISTRY}"

      - name: Verify OCI chart matches GitHub asset
        run: |
          mkdir -p "${RUNNER_TEMP}/verified"
          helm pull "${CHART_REFERENCE}" \
            --version "${CHART_VERSION}" \
            --destination "${RUNNER_TEMP}/verified"
          cmp --silent \
            "${RUNNER_TEMP}/${ASSET_NAME}" \
            "${RUNNER_TEMP}/verified/${ASSET_NAME}"

  finalize-release:
    needs: [validate, publish-chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish GitHub Release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest=false
